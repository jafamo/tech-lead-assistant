[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tech-lead-assistant"
version = "0.1.0"
description = "Personal tool for tech leads to manage 1:1 meetings, generate structured reports and track team health"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "nicegui>=2.0",
    "plotly>=5.18",
    "pandas>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "kaleido>=0.2",
    "sqlmodel>=0.0.14",
    "bcrypt>=4.0",
    "weasyprint>=60",
    "markdown-it-py>=3.0",
    "python-slugify>=8.0",
    "pydantic>=2.5",
    "jsonschema>=4.21",
    "icalendar>=5.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
    "openai>=1.40",
    "ollama>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-bcrypt",
]

[project.scripts]
tla = "tla.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/tla --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
